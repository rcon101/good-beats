<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0e" />
    <meta name="description" content="A quiet, immersive sound visualizer for your browser." />
    <title>Good Beats — sound, in color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Good Beats home"><span class="brand-mark"><i></i><i></i><i></i></span><span>good beats</span></a>
        <div class="top-meta"><span class="live-dot"></span><span id="connection-label">READY WHEN YOU ARE</span><span class="top-divider"></span><span class="mono">WEBGL / AUDIO</span></div>
      </header>
      <main>
        <section class="stage" aria-label="Sound visualization">
          <canvas id="visualizer" aria-label="Animated sound visualization"></canvas>
          <div class="stage-grain"></div>
          <div class="stage-top"><div class="stage-tools"><button class="icon-button" id="performance-toggle" aria-label="Open visualizer settings" aria-controls="performance-dock" aria-expanded="false" title="Visualizer settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg></button><button class="icon-button" id="fullscreen" aria-label="Enter visualizer fullscreen" title="Fullscreen visualizer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4" /></svg></button></div></div>
          <aside class="performance-dock" id="performance-dock" aria-label="Visualizer performance settings" hidden>
            <div class="dock-heading"><div><span class="section-label">VISUAL ENGINE</span><h2>Make it yours.</h2></div><button class="dock-close" id="close-settings" aria-label="Close settings">×</button></div>
            <label class="range-setting"><span class="range-heading"><span>Render resolution</span><output id="resolution-value" for="resolution">100%</output></span><input id="resolution" type="range" min="40" max="300" step="10" value="100"><span class="range-hint">Up to 300% per axis; GPU limits apply</span></label>
            <label class="range-setting"><span class="range-heading"><span>Frame rate</span><output id="fps-limit-value" for="fps-limit">120 FPS</output></span><input id="fps-limit" type="range" min="24" max="240" step="6" value="120"><span class="range-hint">A frame ceiling; display refresh may be lower</span></label>
            <div class="dock-options"><button class="pill-toggle" id="uncapped-toggle" aria-pressed="false">UNCAPPED</button><span class="range-hint">Allow every available frame</span></div>
            <label class="range-setting"><span class="range-heading"><span>Flow detail</span><output id="detail-value" for="detail">3 / 4</output></span><input id="detail" type="range" min="1" max="4" step="1" value="3"><span class="range-hint">More filaments use more GPU</span></label>
            <label class="range-setting"><span class="range-heading"><span>Motion</span><output id="motion-value" for="motion">100%</output></span><input id="motion" type="range" min="0" max="200" step="5" value="100"><span class="range-hint">Ease into stillness or let it drift</span></label>
            <label class="range-setting"><span class="range-heading"><span>Visual intensity</span><output id="intensity-value" for="intensity">100%</output></span><input id="intensity" type="range" min="50" max="180" step="5" value="100"><span class="range-hint">Tune the glow and color depth</span></label>
            <div class="dock-foot"><span>Changes apply live</span><button id="reset-settings" class="reset-button">Reset</button></div>
          </aside>
          <div class="stage-caption"><h1>Good <em>Beats</em></h1></div>
        </section>
        <section class="control-panel">
          <div class="input-block"><span class="section-label">INPUT SOURCE</span><div class="input-options"><button class="source-button active" data-source="system"><span class="source-icon system-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="12" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></span><span><strong>System audio</strong><small>Share screen for system audio</small></span><span class="option-arrow">↗</span></button><button class="source-button" data-source="mic"><span class="source-icon"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg></span><span><strong>Microphone</strong><small>Listen to your space</small></span><span class="option-arrow">↗</span></button></div></div>
          <div class="panel-divider"></div>
          <div class="visual-block"><span class="section-label">VISUAL MOOD</span><div class="mood-row"><button class="mood-button active" data-mood="aurora"><span class="mood-swatch aurora-swatch"></span><span>Aurora</span></button><button class="mood-button" data-mood="tide"><span class="mood-swatch tide-swatch"></span><span>Tide</span></button><button class="mood-button" data-mood="ember"><span class="mood-swatch ember-swatch"></span><span>Ember</span></button></div></div>
          <div class="panel-actions"><button class="start-button" id="start"><span class="play-symbol">▶</span><span id="start-label">Start listening</span><span class="button-arrow">↗</span></button></div>
        </section>
      </main>
      <footer><span>MADE FOR THE MOMENT</span><span class="footer-center">SOUND, IN COLOR <span>✳</span></span><span>NO RECORDINGS. JUST RESONANCE.</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
